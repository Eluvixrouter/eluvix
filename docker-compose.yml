# Eluvix Modular Docker Compose Entrypoint
# Services are organized into domain modules under ./docker/compose/
# Use `docker compose --profile core up -d` or pick individual services via UI / CLI:
#   docker compose up -d switchyard openviking trueforge

include:
  - path: ./docker/compose/core.yml
  - path: ./docker/compose/inference.yml
  - path: ./docker/compose/memory.yml
  - path: ./docker/compose/harnesses.yml

networks:
  eluvix-net:
    driver: bridge
