services:
  switchyard:
    build:
      context: ./docker/switchyard
      dockerfile: Dockerfile
    container_name: eluvix-switchyard
    ports:
      - "127.0.0.1:${SWITCHYARD_PORT:-8080}:8080"
    restart: unless-stopped
    networks:
      - eluvix-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  vllm-sr:
    build:
      context: ./docker/vllm-sr
      dockerfile: Dockerfile
    container_name: eluvix-vllm-sr
    ports:
      - "127.0.0.1:${VLLM_SR_PORT:-8001}:8001"
    restart: unless-stopped
    networks:
      - eluvix-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: eluvix-ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    networks:
      - eluvix-net

  vllm:
    build:
      context: ./docker/vllm
      dockerfile: Dockerfile
    container_name: eluvix-vllm
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped
    networks:
      - eluvix-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  agent-router:
    build:
      context: ./docker/agent-router
      dockerfile: Dockerfile
    container_name: eluvix-agent-router
    ports:
      - "127.0.0.1:${AGENT_ROUTER_PORT:-8002}:8002"
    restart: unless-stopped
    networks:
      - eluvix-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  agentgateway:
    build:
      context: ./docker/agentgateway
      dockerfile: Dockerfile
    container_name: eluvix-agentgateway
    ports:
      - "127.0.0.1:${AGENT_GATEWAY_PORT:-8003}:8003"
    restart: unless-stopped
    networks:
      - eluvix-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8003/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  openviking:
    image: ghcr.io/volcengine/openviking:latest
    container_name: eluvix-openviking
    profiles: ["memory"]
    ports:
      - "127.0.0.1:${OPENVIKING_PORT:-1933}:1933"
    volumes:
      - openviking_data:/data
    restart: unless-stopped
    networks:
      - eluvix-net

  trueforge:
    image: ghcr.io/truefoundry/trueforge:latest
    container_name: eluvix-trueforge
    profiles: ["harness"]
    ports:
      - "127.0.0.1:${TRUEFORGE_PORT:-8790}:8790"
    volumes:
      - trueforge_data:/root/.trueforge
    restart: unless-stopped
    networks:
      - eluvix-net

volumes:
  ollama_data:
    driver: local
  openviking_data:
    driver: local
  trueforge_data:
    driver: local

networks:
  eluvix-net:
    driver: bridge

