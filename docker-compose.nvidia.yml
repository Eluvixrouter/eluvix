# Eluvix Hardware Override - NVIDIA CUDA Acceleration
# Usage: docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
#
# PREREQUISITE (hunt-2 S11): this file alone does NOT give the container a
# GPU. The device reservation below is only honored when the host has the
# NVIDIA driver AND the NVIDIA Container Toolkit installed and configured
# as the Docker runtime:
#   sudo apt-get install -y nvidia-container-toolkit
#   sudo nvidia-ctk runtime configure --runtime=docker
#   sudo systemctl restart docker
#   docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi
# Without the toolkit the container starts with no GPU visible (or fails
# to start), no matter what this file requests.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
