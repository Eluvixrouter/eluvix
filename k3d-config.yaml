---
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: eluvix-local
servers: 1
agents: 1
# k3s release line: pinned to a supported line (the k3s stable channel as
# of November 2026). Do not drift back to the 1.31 line: upstream support
# for Kubernetes 1.31 ended in October 2025.
image: docker.io/rancher/k3s:v1.36.5-k3s1
ports:
  # App ports land on the cluster nodes, where the chart's NodePort
  # Services (helm/eluvix/values-local.yaml) listen. Mappings aimed at
  # the loadbalancer only reach Traefik on 80/443 — the ClusterIP-era
  # config sent 3588/8080/11434/8002/8003 nowhere.
  # Every mapping is bound to 127.0.0.1 explicitly (audit M-26): this is
  # a local dev stack, and Ollama (11434) has no auth of its own — an
  # unbound mapping would expose it, the MCP gateway, and the dashboard
  # to the whole LAN.
  - port: 127.0.0.1:3588:3588
    nodeFilters:
      - server:0
      - agent:0
  - port: 127.0.0.1:8080:8080
    nodeFilters:
      - server:0
      - agent:0
  - port: 127.0.0.1:11434:11434
    nodeFilters:
      - server:0
      - agent:0
  - port: 127.0.0.1:8002:8002
    nodeFilters:
      - server:0
      - agent:0
  - port: 127.0.0.1:8003:8003
    nodeFilters:
      - server:0
      - agent:0
  - port: 127.0.0.1:80:80
    nodeFilters:
      - loadbalancer
  - port: 127.0.0.1:443:443
    nodeFilters:
      - loadbalancer
registries:
  create:
    name: k3d-eluvix-registry.localhost
    host: "127.0.0.1"
    hostPort: "5001"
options:
  k3d:
    wait: true
    timeout: "120s"
  k3s:
    extraArgs:
      # NodePort range widened deliberately, and ONLY for this coupling:
      # helm/eluvix/values-local.yaml sets NodePorts below the Kubernetes
      # default range (30000-32767) — 3588, 8080, 11434, 8002, 8003 — so
      # the local chart is valid only because this flag widens the range.
      # Do not drop this flag without moving those nodePorts into
      # 30000-32767 (which would break the host-port mappings above), and
      # do not add low nodePorts to values-local.yaml without this flag.
      # The wide range is a local-dev convenience, not a production
      # setting: any NodePort service in the cluster can grab low ports.
      - arg: --kube-apiserver-arg=service-node-port-range=1-65535
        nodeFilters:
          - server:*
