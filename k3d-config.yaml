---
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: eluvix-local
servers: 1
agents: 1
image: docker.io/rancher/k3s:v1.31.5-k3s1
ports:
  # App ports land on the cluster nodes, where the chart's NodePort
  # Services (helm/eluvix/values-local.yaml) listen. Mappings aimed at
  # the loadbalancer only reach Traefik on 80/443 — the ClusterIP-era
  # config sent 3588/8080/11434/8002/8003 nowhere.
  - port: 3588:3588
    nodeFilters:
      - server:0
      - agent:0
  - port: 8080:8080
    nodeFilters:
      - server:0
      - agent:0
  - port: 11434:11434
    nodeFilters:
      - server:0
      - agent:0
  - port: 8002:8002
    nodeFilters:
      - server:0
      - agent:0
  - port: 8003:8003
    nodeFilters:
      - server:0
      - agent:0
  - port: 80:80
    nodeFilters:
      - loadbalancer
  - port: 443:443
    nodeFilters:
      - loadbalancer
registries:
  create:
    name: k3d-eluvix-registry.localhost
    host: "0.0.0.0"
    hostPort: "5001"
options:
  k3d:
    wait: true
    timeout: "120s"
