<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Core Nexus Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Dark Shield Backdrop -->
    <linearGradient id="shieldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="deepGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur2" />
    </filter>
  </defs>

  <!-- Outer Ambient Glow -->
  <polygon points="50,6 88,24 88,58 50,94 12,58 12,24" fill="#38bdf8" opacity="0.25" filter="url(#deepGlow)" />

  <!-- Outer Shield Border -->
  <polygon points="50,8 86,25 86,56 50,91 14,56 14,25" fill="url(#shieldDark)" stroke="url(#shieldGrad)" stroke-width="3" stroke-linejoin="round" />

  <!-- Inner Angular Shield Accent -->
  <polygon points="50,16 78,30 78,52 50,79 22,52 22,30" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" stroke-linejoin="round" />

  <!-- Circuit Routing Traces -->
  <path d="M 50 18 L 50 35 M 26 33 L 42 42 M 74 33 L 58 42 M 28 55 L 42 62 M 72 55 L 58 62 M 50 78 L 50 66" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Center Energy Core (Stylized E-Nexus) -->
  <!-- Top Arm of E -->
  <path d="M 40 38 L 62 38" stroke="url(#coreGrad)" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)" />
  <!-- Middle Arm of E -->
  <path d="M 40 49 L 58 49" stroke="url(#coreGrad)" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)" />
  <!-- Bottom Arm of E -->
  <path d="M 40 60 L 62 60" stroke="url(#coreGrad)" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)" />
  <!-- Vertical Spine of E -->
  <path d="M 40 38 L 40 60" stroke="url(#coreGrad)" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Interconnected Network Nodes -->
  <circle cx="50" cy="8" r="2.5" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="86" cy="25" r="2.5" fill="#6366f1" filter="url(#neonGlow)" />
  <circle cx="86" cy="56" r="2.5" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="50" cy="91" r="2.5" fill="#6366f1" filter="url(#neonGlow)" />
  <circle cx="14" cy="56" r="2.5" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="14" cy="25" r="2.5" fill="#6366f1" filter="url(#neonGlow)" />

  <circle cx="62" cy="38" r="2" fill="#ffffff" />
  <circle cx="58" cy="49" r="2" fill="#ffffff" />
  <circle cx="62" cy="60" r="2" fill="#ffffff" />
</svg>
