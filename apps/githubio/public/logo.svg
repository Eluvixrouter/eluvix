<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="logoShieldGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="logoCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Emblem (Left 80x80) -->
  <g transform="translate(5, 5) scale(0.7)">
    <!-- Outer Shield Border -->
    <polygon points="50,8 86,25 86,56 50,91 14,56 14,25" fill="#090d16" stroke="url(#logoShieldGrad)" stroke-width="3.5" stroke-linejoin="round" />
    <polygon points="50,16 78,30 78,52 50,79 22,52 22,30" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" stroke-linejoin="round" />
    <!-- Traces -->
    <path d="M 50 18 L 50 35 M 26 33 L 42 42 M 74 33 L 58 42 M 28 55 L 42 62 M 72 55 L 58 62" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
    <!-- E-Nexus Core -->
    <path d="M 40 37 L 64 37" stroke="url(#logoCoreGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#logoGlow)" />
    <path d="M 40 49 L 58 49" stroke="url(#logoCoreGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#logoGlow)" />
    <path d="M 40 61 L 64 61" stroke="url(#logoCoreGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#logoGlow)" />
    <path d="M 40 37 L 40 61" stroke="url(#logoCoreGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#logoGlow)" />
    <!-- Nodes -->
    <circle cx="50" cy="8" r="3" fill="#38bdf8" filter="url(#logoGlow)" />
    <circle cx="86" cy="25" r="3" fill="#6366f1" />
    <circle cx="86" cy="56" r="3" fill="#38bdf8" />
    <circle cx="50" cy="91" r="3" fill="#6366f1" filter="url(#logoGlow)" />
    <circle cx="14" cy="56" r="3" fill="#38bdf8" />
    <circle cx="14" cy="25" r="3" fill="#6366f1" />
  </g>

  <!-- Wordmark Text -->
  <text x="85" y="47" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" fill="url(#textGrad)">
    ELUV<tspan fill="#38bdf8">I</tspan><tspan fill="#818cf8">X</tspan>
  </text>

  <!-- Tagline Badge -->
  <rect x="85" y="55" width="168" height="15" rx="3" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="0.8" />
  <text x="91" y="66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.2" fill="#38bdf8">
    SOVEREIGN AI ROUTER
  </text>
</svg>
