appId: com.eluvix.desktop
productName: Eluvix
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json
  - node_modules/**/*

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  synopsis: Local LLM token router and proxy with Billama integration
  description: Connect your developer harnesses (OpenCode, VSCode) to local models or upstream providers seamlessly.

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
