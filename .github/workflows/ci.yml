name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Hunt-2 L1: least privilege — this job only builds and tests, it never
    # publishes, so it needs read-only contents and nothing else.
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 11.24.0

    # Hunt-2 L10: the Node version comes from the repo's single pinned
    # source, .nvmrc, instead of a hardcoded matrix entry.
    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build Router Core
      run: pnpm --filter @eluvix/router-core build

    # Hunt-3 D-H3-03: the offline Paperclip E2E harness
    # (scripts/paperclip-e2e.mjs) was never executed by CI, so the
    # paperclip routes it defines went unexercised. It needs the
    # router-core, plugin, and adapter dists built first; it stays
    # offline/mock-based (loopback HTTP + SQLite), no network.
    - name: Build Paperclip Plugin & Adapter
      run: pnpm --filter @eluvix/paperclip-plugin build && pnpm --filter @eluvix/paperclip-adapter build

    - name: Run Offline Paperclip E2E
      run: node scripts/paperclip-e2e.mjs

    - name: Run Unit Tests (Router Core)
      run: pnpm --filter @eluvix/router-core test

    # Hunt-2 M5: CI previously never built or tested
    # @eluvix/opencode-harness, so a breaking change confined to it merged
    # with green CI. Build after router-core (the harness depends on it).
    - name: Build OpenCode Harness
      run: pnpm --filter @eluvix/opencode-harness build

    - name: Run Unit Tests (OpenCode Harness)
      run: pnpm --filter @eluvix/opencode-harness test

    - name: Run Unit Tests (Next.js Dashboard)
      run: pnpm --filter nextjs test

    - name: Typecheck Next.js Dashboard
      run: pnpm --filter nextjs exec tsc --noEmit

    # Hunt-2 L27: lint both Next.js apps. githubio previously defined a
    # `lint` script but shipped no ESLint config (so `next lint` would
    # prompt interactively); it now uses the same config as nextjs, and
    # two unused imports it flagged were removed. Desktop has no test or
    # lint harness at all, so it stays ungated — desktop tests are a
    # follow-up, not something to fabricate here.
    - name: Lint Next.js Dashboard
      run: pnpm --filter nextjs lint

    - name: Lint GitHub Pages Documentation Site
      run: pnpm --filter githubio lint

    - name: Build Next.js Dashboard
      run: pnpm --filter nextjs build
      env:
        NEXT_TELEMETRY_DISABLED: 1

    - name: Build Desktop Application
      run: pnpm --filter @eluvix/desktop build

    # Hunt-3 D-H3-01: the changelog once advertised four releases that
    # never shipped (v1.1.0-v1.3.1) while omitting the four that did.
    # Fail CI if the current VERSION has no entry in the releases page,
    # so the next release cannot go out undocumented.
    - name: Check releases page lists current version
      run: grep -q "^## v$(cat VERSION) " apps/githubio/src/app/docs/releases/page.mdx

    # Hunt-3 D-H3-07: README test counts went stale with no check on
    # them. The script asserts the per-suite file counts and summed
    # total match the on-disk inventory (test totals are verified by
    # the suites themselves in CI).
    - name: Check README test counts match inventory
      run: node scripts/check-readme-counts.mjs

    - name: Build GitHub Pages Documentation Site
      run: pnpm --filter githubio build
      env:
        NODE_ENV: production
        BASE_PATH: ""
        NEXT_TELEMETRY_DISABLED: 1
