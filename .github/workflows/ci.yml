name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Hunt-2 L1: least privilege — this job only builds and tests, it never
    # publishes, so it needs read-only contents and nothing else.
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 11.24.0

    # Hunt-2 L10: the Node version comes from the repo's single pinned
    # source, .nvmrc, instead of a hardcoded matrix entry.
    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build Router Core
      run: pnpm --filter @eluvix/router-core build

    - name: Run Unit Tests (Router Core)
      run: pnpm --filter @eluvix/router-core test

    - name: Run Unit Tests (Next.js Dashboard)
      run: pnpm --filter nextjs test

    - name: Typecheck Next.js Dashboard
      run: pnpm --filter nextjs exec tsc --noEmit

    # Hunt-2 L27: lint both Next.js apps. githubio previously defined a
    # `lint` script but shipped no ESLint config (so `next lint` would
    # prompt interactively); it now uses the same config as nextjs, and
    # two unused imports it flagged were removed. Desktop has no test or
    # lint harness at all, so it stays ungated — desktop tests are a
    # follow-up, not something to fabricate here.
    - name: Lint Next.js Dashboard
      run: pnpm --filter nextjs lint

    - name: Lint GitHub Pages Documentation Site
      run: pnpm --filter githubio lint

    - name: Build Next.js Dashboard
      run: pnpm --filter nextjs build
      env:
        NEXT_TELEMETRY_DISABLED: 1

    - name: Build Desktop Application
      run: pnpm --filter @eluvix/desktop build

    - name: Build GitHub Pages Documentation Site
      run: pnpm --filter githubio build
      env:
        NODE_ENV: production
        BASE_PATH: ""
        NEXT_TELEMETRY_DISABLED: 1
