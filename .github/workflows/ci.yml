name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.24.0

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build Router Core
      run: pnpm --filter @eluvix/router-core build

    - name: Run Unit Tests (Router Core)
      run: pnpm --filter @eluvix/router-core test

    - name: Build Next.js Dashboard
      run: pnpm --filter nextjs build
      env:
        NEXT_TELEMETRY_DISABLED: 1

    - name: Build GitHub Pages Documentation Site
      run: pnpm --filter githubio build
      env:
        NODE_ENV: production
        BASE_PATH: ""
        NEXT_TELEMETRY_DISABLED: 1

