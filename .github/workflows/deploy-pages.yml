name: Deploy GitHub Pages Documentation

on:
  push:
    branches: [ main, scaffold1 ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0

      # Hunt-2 L10: Node version comes from .nvmrc, the repo's single
      # pinned source, instead of a hardcoded value.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static documentation export
        run: pnpm --filter githubio build
        env:
          NODE_ENV: production
          BASE_PATH: ""
          NEXT_TELEMETRY_DISABLED: 1

      - name: Add .nojekyll and CNAME
        run: |
          touch apps/githubio/out/.nojekyll
          echo "eluvix.com" > apps/githubio/out/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/githubio/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
