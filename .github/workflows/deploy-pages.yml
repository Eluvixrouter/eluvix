name: Deploy GitHub Pages Documentation

on:
  push:
    branches: [ main, scaffold1 ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static documentation export
        run: pnpm --filter githubio build
        env:
          NODE_ENV: production
          BASE_PATH: ""
          NEXT_TELEMETRY_DISABLED: 1

      - name: Add .nojekyll and CNAME
        run: |
          touch apps/githubio/out/.nojekyll
          echo "eluvix.com" > apps/githubio/out/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/githubio/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
