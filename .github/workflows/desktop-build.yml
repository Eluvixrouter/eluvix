name: Build Desktop Application

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish binaries to GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release Tag name (optional, e.g. v0.1.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Install dependencies
        run: pnpm install

      - name: Build shared packages
        run: pnpm --filter @eluvix/router-core build

      - name: Build Desktop app
        run: pnpm --filter @eluvix/desktop build

      # Packaging invokes electron-builder directly (the build step above
      # already produced dist/) with --publish never:
      # - electron-builder's own publishing is never used here — the
      #   release job below ships the uploaded artifacts. Without
      #   --publish never, its update-info generation crashes on PR builds
      #   ("Cannot read properties of null (reading 'channel')") because
      #   GITHUB_TOKEN makes it infer a GitHub publish target with no
      #   release channel.
      # - On Windows this also avoids `pnpm run`: pnpm exports npm_execpath
      #   pointing at its pnpm.mjs, and @electron/rebuild (spawned by
      #   electron-builder to rebuild better-sqlite3) tries to execute
      #   that .mjs as a native binary, which Windows rejects ("%1 is not
      #   a valid Win32 application").
      - name: Package Desktop app (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: ./node_modules/.bin/electron-builder --linux --publish never

      - name: Package Desktop app (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: ./node_modules/.bin/electron-builder --mac --publish never

      - name: Package Desktop app (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: .\node_modules\.bin\electron-builder.cmd --win --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eluvix-desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          if-no-files-found: error

  release:
    name: Publish Release Binaries
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: eluvix-desktop-*
          path: release-artifacts
          merge-multiple: true

      - name: Display downloaded binaries
        run: ls -lh release-artifacts

      - name: Generate SHA256 Checksums
        run: |
          cd release-artifacts
          for f in *; do [ -f "$f" ] && [ "$f" != "SHA256SUMS.txt" ] && sha256sum "$f"; done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./apps/desktop/package.json').version")
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Eluvix ${{ steps.release_tag.outputs.tag }}
          files: |
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/*.exe
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
