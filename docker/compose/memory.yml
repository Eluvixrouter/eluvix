services:
  openviking:
    build:
      context: ../openviking
      dockerfile: Dockerfile
    container_name: eluvix-openviking
    profiles: ["memory", "all"]
    ports:
      - "127.0.0.1:${OPENVIKING_PORT:-1933}:1933"
    volumes:
      - openviking_data:/data
    restart: unless-stopped
    networks:
      - eluvix-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1933/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  lightrag:
    build:
      context: ../lightrag
      dockerfile: Dockerfile
    container_name: eluvix-lightrag
    profiles: ["memory", "all"]
    ports:
      - "127.0.0.1:${LIGHTRAG_PORT:-9621}:9621"
    volumes:
      - lightrag_data:/data
    restart: unless-stopped
    networks:
      - eluvix-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9621/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  graphiti:
    build:
      context: ../graphiti
      dockerfile: Dockerfile
    container_name: eluvix-graphiti
    profiles: ["memory", "all"]
    ports:
      - "127.0.0.1:${GRAPHITI_PORT:-8004}:8004"
    volumes:
      - graphiti_data:/data
    restart: unless-stopped
    networks:
      - eluvix-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8004/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  openviking_data:
    driver: local
  lightrag_data:
    driver: local
  graphiti_data:
    driver: local
