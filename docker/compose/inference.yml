services:
  ollama:
    image: ollama/ollama:latest
    container_name: eluvix-ollama
    profiles: ["inference", "all"]
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    # Compose-level readiness signal (spin_up polls the Ollama API
    # separately, but compose itself previously had no signal for ollama).
    # Uses the in-image ollama binary, not wget/curl: the ollama image
    # does not ship them, and `ollama list` exits nonzero while the
    # server is down. (Not runtime-verified here — no docker binary in
    # this environment; see the batch report.)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=http://localhost:*,http://127.0.0.1:*,app://*
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    networks:
      - eluvix-net

  vllm:
    build:
      context: ../vllm
      dockerfile: Dockerfile
    container_name: eluvix-vllm
    profiles: ["inference", "all"]
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    # No HF cache mount: this service builds the in-memory vllm SIM, which
    # never reads /root/.cache/huggingface. (The sglang service below runs
    # the real image, so it keeps its cache mount. If this service is ever
    # swapped for a real vLLM image, re-add the mount then.)
    restart: unless-stopped
    networks:
      - eluvix-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  sglang:
    image: lmsysorg/sglang:latest
    container_name: eluvix-sglang
    profiles: ["inference", "all"]
    ports:
      - "127.0.0.1:${SGLANG_PORT:-30000}:30000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped
    networks:
      - eluvix-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:30000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  ollama_data:
    driver: local
