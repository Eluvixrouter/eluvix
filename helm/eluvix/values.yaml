global:
  platform: k3d
  environment: production

# 1. Switchyard Sovereign Balancer & Gateway
switchyard:
  enabled: true
  image:
    repository: eluvix-switchyard
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  config:
    strategy: cost-complexity
    defaultTier: tier-1
    privacyGuard:
      enabled: true
      anonymizePII: true
      hashTokens: true

# 2. Next.js Sovereign Dashboard & Visual Editor
nextjs:
  enabled: true
  image:
    repository: eluvix-nextjs
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 3588
  service:
    type: ClusterIP
    port: 3588
  env:
    NODE_ENV: production
  persistence:
    enabled: true
    storageClass: local-path
    size: 2Gi
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

# 3. Ollama Local Inference Engine
ollama:
  enabled: true
  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 11434
  service:
    type: ClusterIP
    port: 11434
  persistence:
    enabled: true
    storageClass: local-path
    size: 20Gi
    mountPath: /root/.ollama
  env:
    OLLAMA_ORIGINS: "*"
    OLLAMA_HOST: "0.0.0.0:11434"
  resources:
    limits:
      cpu: 4000m
      memory: 8Gi
    requests:
      cpu: 500m
      memory: 1Gi
  gpu:
    enabled: false
    count: 1
    resourceName: nvidia.com/gpu
  initModels:
    enabled: true
    models:
      - smollm:135m

# 4. Agent Router (Autonomous Agents & MCP)
agentRouter:
  enabled: true
  image:
    repository: eluvix-agent-router
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8002
  service:
    type: ClusterIP
    port: 8002
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi

# 5. Agent Gateway (MCP Tool Server)
agentGateway:
  enabled: true
  image:
    repository: eluvix-agentgateway
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8003
  service:
    type: ClusterIP
    port: 8003
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi

# 6. Ingress Configuration
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  hosts:
    - host: eluvix.local
      paths:
        - path: /
          pathType: Prefix
          service: nextjs
        - path: /v1
          pathType: Prefix
          service: switchyard
  tls: []

# Dynamic Routing Configurations (Compiled by Visual Editor)
routingConfig:
  eluvixJson: ""
  bifrostYaml: ""
  agentRouterJson: ""
  agentGatewayJson: ""
