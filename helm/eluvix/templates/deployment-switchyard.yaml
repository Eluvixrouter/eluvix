{{- if .Values.switchyard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eluvix.fullname" . }}-switchyard
  labels:
    {{- include "eluvix.labels" . | nindent 4 }}
    app.kubernetes.io/component: switchyard
spec:
  replicas: {{ .Values.switchyard.replicaCount }}
  selector:
    matchLabels:
      {{- include "eluvix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: switchyard
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-routing.yaml") . | sha256sum }}
      labels:
        {{- include "eluvix.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: switchyard
    spec:
      containers:
        - name: switchyard
          image: "{{ .Values.switchyard.image.repository }}:{{ .Values.switchyard.image.tag }}"
          imagePullPolicy: {{ .Values.switchyard.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.switchyard.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.switchyard.port }}"
            - name: ELUVIX_CONFIG_PATH
              value: /config/eluvix.json
            {{- if .Values.switchyard.authToken }}
            - name: SWITCHYARD_AUTH_TOKEN
              value: {{ .Values.switchyard.authToken | quote }}
            {{- end }}
          volumeMounts:
            - name: routing-config-volume
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.switchyard.resources | nindent 12 }}
      volumes:
        - name: routing-config-volume
          configMap:
            name: {{ include "eluvix.fullname" . }}-routing-config
{{- end }}
