{{- if .Values.nextjs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eluvix.fullname" . }}-nextjs
  labels:
    {{- include "eluvix.labels" . | nindent 4 }}
    app.kubernetes.io/component: nextjs
spec:
  replicas: {{ .Values.nextjs.replicaCount }}
  selector:
    matchLabels:
      {{- include "eluvix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nextjs
  template:
    metadata:
      labels:
        {{- include "eluvix.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nextjs
    spec:
      containers:
        - name: nextjs
          image: "{{ .Values.nextjs.image.repository }}:{{ .Values.nextjs.image.tag }}"
          imagePullPolicy: {{ .Values.nextjs.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.nextjs.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.nextjs.env.NODE_ENV | quote }}
            - name: PORT
              value: "{{ .Values.nextjs.port }}"
            - name: ELUVIX_CONFIG_PATH
              value: /config/eluvix.json
          volumeMounts:
            # NOTE: no data PVC is mounted. The app keeps its state under
            # $XDG_CONFIG_HOME/eluvix, not /app/apps/nextjs/data (the path
            # a previous PVC revision mounted); that mount persisted nothing.
            - name: routing-config-volume
              mountPath: /config/eluvix.json
              subPath: eluvix.json
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.nextjs.resources | nindent 12 }}
      volumes:
        - name: routing-config-volume
          configMap:
            name: {{ include "eluvix.fullname" . }}-routing-config
{{- end }}
