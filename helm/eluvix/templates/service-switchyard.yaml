{{- if .Values.switchyard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eluvix.fullname" . }}-switchyard
  labels:
    {{- include "eluvix.labels" . | nindent 4 }}
    app.kubernetes.io/component: switchyard
spec:
  type: {{ .Values.switchyard.service.type }}
  ports:
    - port: {{ .Values.switchyard.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "eluvix.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: switchyard
{{- end }}
