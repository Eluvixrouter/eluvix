{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "eluvix.fullname" . }}-ingress
  labels:
    {{- include "eluvix.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "eluvix.fullname" $ }}-{{ .service }}
                port:
                  # Hunt-2 S13: every service the chart actually runs maps
                  # to its configured port; an unknown service fails the
                  # render instead of silently routing to port 80.
                  number: {{ if eq .service "nextjs" }}{{ $.Values.nextjs.service.port }}{{ else if eq .service "switchyard" }}{{ $.Values.switchyard.service.port }}{{ else if eq .service "ollama" }}{{ $.Values.ollama.service.port }}{{ else if eq .service "agentRouter" }}{{ $.Values.agentRouter.service.port }}{{ else if eq .service "agentGateway" }}{{ $.Values.agentGateway.service.port }}{{ else }}{{ fail (printf "ingress: unknown service %q (expected nextjs, switchyard, ollama, agentRouter or agentGateway)" .service) }}{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
