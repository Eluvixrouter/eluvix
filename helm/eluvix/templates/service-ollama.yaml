{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eluvix.fullname" . }}-ollama
  labels:
    {{- include "eluvix.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  type: {{ .Values.ollama.service.type }}
  ports:
    - port: {{ .Values.ollama.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- with .Values.ollama.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
  selector:
    {{- include "eluvix.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
{{- end }}
