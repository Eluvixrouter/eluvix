{{- if .Values.ollama.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eluvix.fullname" . }}-ollama
  labels:
    {{- include "eluvix.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  replicas: {{ .Values.ollama.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "eluvix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        {{- include "eluvix.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ollama
    spec:
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ollama.port }}
              protocol: TCP
          env:
            - name: OLLAMA_ORIGINS
              value: {{ .Values.ollama.env.OLLAMA_ORIGINS | quote }}
            - name: OLLAMA_HOST
              value: {{ .Values.ollama.env.OLLAMA_HOST | quote }}
          {{- if .Values.ollama.persistence.enabled }}
          volumeMounts:
            - name: ollama-storage
              mountPath: {{ .Values.ollama.persistence.mountPath }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: {{ .Values.ollama.resources.limits.cpu }}
              memory: {{ .Values.ollama.resources.limits.memory }}
              {{- if .Values.ollama.gpu.enabled }}
              {{ .Values.ollama.gpu.resourceName }}: {{ .Values.ollama.gpu.count }}
              {{- end }}
            requests:
              cpu: {{ .Values.ollama.resources.requests.cpu }}
              memory: {{ .Values.ollama.resources.requests.memory }}
      {{- if .Values.ollama.persistence.enabled }}
      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: {{ include "eluvix.fullname" . }}-ollama-data
      {{- end }}
{{- end }}
