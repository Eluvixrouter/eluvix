{{- if .Values.agentRouter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eluvix.fullname" . }}-agent-router
  labels:
    {{- include "eluvix.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-router
spec:
  type: {{ .Values.agentRouter.service.type }}
  ports:
    - port: {{ .Values.agentRouter.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "eluvix.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent-router
{{- end }}
