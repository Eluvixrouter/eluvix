{{- if .Values.agentGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eluvix.fullname" . }}-agentgateway
  labels:
    {{- include "eluvix.labels" . | nindent 4 }}
    app.kubernetes.io/component: agentgateway
spec:
  replicas: {{ .Values.agentGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "eluvix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agentgateway
  template:
    metadata:
      labels:
        {{- include "eluvix.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agentgateway
    spec:
      containers:
        - name: agentgateway
          image: "{{ .Values.agentGateway.image.repository }}:{{ .Values.agentGateway.image.tag }}"
          imagePullPolicy: {{ .Values.agentGateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.agentGateway.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.agentGateway.port }}"
            - name: GATEWAY_CONFIG_PATH
              value: "/etc/eluvix/gateway.json"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/eluvix
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.agentGateway.resources | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "eluvix.fullname" . }}-routing-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eluvix.fullname" . }}-agentgateway
  labels:
    {{- include "eluvix.labels" . | nindent 4 }}
    app.kubernetes.io/component: agentgateway
spec:
  type: {{ .Values.agentGateway.service.type }}
  ports:
    - port: {{ .Values.agentGateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "eluvix.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agentgateway
{{- end }}
