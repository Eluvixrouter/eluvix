global:
  platform: k3d
  environment: local-dev

switchyard:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi

nextjs:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi

ollama:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 11434
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 200m
      memory: 512Mi
  gpu:
    enabled: false
  initModels:
    enabled: false

agentRouter:
  replicaCount: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 32Mi

agentGateway:
  replicaCount: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 32Mi

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: localhost
      paths:
        - path: /
          pathType: Prefix
          service: nextjs
        - path: /v1
          pathType: Prefix
          service: switchyard
