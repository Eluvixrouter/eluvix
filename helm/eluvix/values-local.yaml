global:
  platform: k3d
  environment: local-dev

switchyard:
  replicaCount: 1
  service:
    # NodePort so the k3d host-port mappings (k3d-config.yaml maps host
    # ports onto the cluster nodes) land on a real listener.
    type: NodePort
    port: 8080
    nodePort: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi

nextjs:
  replicaCount: 1
  service:
    type: NodePort
    port: 3588
    nodePort: 3588
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi

ollama:
  replicaCount: 1
  service:
    type: NodePort
    port: 11434
    nodePort: 11434
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 200m
      memory: 512Mi
  gpu:
    enabled: false
  initModels:
    # The chart's default routing config points exclusively at smollm:135m,
    # so the local k3d stack needs the init-models hook job too.
    enabled: true

agentRouter:
  replicaCount: 1
  service:
    type: NodePort
    nodePort: 8002
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 32Mi

agentGateway:
  replicaCount: 1
  service:
    type: NodePort
    nodePort: 8003
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 32Mi

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: localhost
      paths:
        - path: /
          pathType: Prefix
          service: nextjs
        - path: /v1
          pathType: Prefix
          service: switchyard
