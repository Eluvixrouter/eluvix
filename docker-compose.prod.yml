version: '3.8'

services:
  nextjs:
    build:
      context: .
      dockerfile: apps/nextjs/Dockerfile
    ports:
      - "127.0.0.1:3588:3588"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3588}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      # Mount the sqlite DB for chat history & metrics persistence
      - ./data:/app/apps/nextjs/data
    restart: unless-stopped
    depends_on:
      - switchyard

  switchyard:
    build:
      context: ./docker/switchyard
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
